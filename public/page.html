<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <title>NexChat</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #020408;
      --neon-cyan: #00fff7;
      --neon-pink: #ff00c8;
      --neon-purple: #9d00ff;
      --neon-green: #00ff88;
      --border: rgba(0, 255, 247, 0.15);
      --text-dim: rgba(224, 250, 255, 0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* Animated grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,247,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridScroll 12s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridScroll {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Center radial glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 800px; height: 800px;
      background: radial-gradient(ellipse, rgba(0,255,247,0.07) 0%, rgba(157,0,255,0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Scan line */
    .scanline {
      position: fixed;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(transparent, rgba(0,255,247,0.07), transparent);
      animation: scanline 6s linear infinite;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes scanline {
      0%   { top: -4px; }
      100% { top: 100%; }
    }

    /* Main layout */
    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 24px;
    }

    /* ── LOGO SECTION ── */
    .logo-section {
      text-align: center;
      animation: fadeDown 0.9s ease both;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 28px;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green), 0 0 22px var(--neon-green);
      animation: blink 1.6s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    /* Big glowing app name */
    .app-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(64px, 16vw, 130px);
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(0,255,247,0.55)) drop-shadow(0 0 60px rgba(157,0,255,0.3));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(0,255,247,0.55)) drop-shadow(0 0 60px rgba(157,0,255,0.3)); }
      50%       { filter: drop-shadow(0 0 50px rgba(0,255,247,0.8)) drop-shadow(0 0 90px rgba(157,0,255,0.5)); }
    }

    .tagline {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
    }

    /* ── DECORATIVE LINE ── */
    .deco-line {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.9s 0.3s ease both;
    }

    .deco-line::before,
    .deco-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0.5;
    }

    .deco-line span {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(0,255,247,0.3);
      white-space: nowrap;
    }

    /* ── LAUNCH BUTTON ── */
    .btn-wrap {
      animation: fadeUp 0.9s 0.4s ease both;
    }

    .launch-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 56px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      text-shadow: 0 0 14px var(--neon-pink);
      box-shadow:
        0 0 28px rgba(255,0,200,0.35),
        0 0 60px rgba(255,0,200,0.15),
        inset 0 0 28px rgba(255,0,200,0.06);
      transition: all 0.35s ease;
      cursor: pointer;
    }

    /* Sweeping fill on hover */
    .launch-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,0,200,0.18), rgba(157,0,255,0.12));
      opacity: 0;
      transition: opacity 0.35s;
    }

    .launch-btn:hover {
      transform: translateY(-4px);
      box-shadow:
        0 0 55px rgba(255,0,200,0.65),
        0 0 110px rgba(255,0,200,0.25),
        inset 0 0 40px rgba(255,0,200,0.12);
    }

    .launch-btn:hover::before { opacity: 1; }
    .launch-btn:active { transform: translateY(-1px) scale(0.97); }

    .launch-btn .label,
    .launch-btn svg {
      position: relative;
      z-index: 1;
    }

    .arrow {
      transition: transform 0.35s;
    }

    .launch-btn:hover .arrow {
      transform: translate(5px, -5px);
    }

    /* Neon flicker */
    .launch-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,0,200,0.04);
      animation: flicker 5s infinite;
    }

    @keyframes flicker {
      0%, 94%, 100% { opacity: 1; }
      95%  { opacity: 0.2; }
      96%  { opacity: 1; }
      97%  { opacity: 0.4; }
      98%  { opacity: 1; }
    }

    /* Corner brackets on button */
    .btn-corner {
      position: absolute;
      width: 10px; height: 10px;
      z-index: 2;
    }
    .btn-corner-tl { top: 4px; left: 4px;   border-top:  1px solid var(--neon-cyan); border-left:  1px solid var(--neon-cyan); }
    .btn-corner-tr { top: 4px; right: 4px;  border-top:  1px solid var(--neon-cyan); border-right: 1px solid var(--neon-cyan); }
    .btn-corner-bl { bottom: 4px; left: 4px;  border-bottom: 1px solid var(--neon-purple); border-left:  1px solid var(--neon-purple); }
    .btn-corner-br { bottom: 4px; right: 4px; border-bottom: 1px solid var(--neon-purple); border-right: 1px solid var(--neon-purple); }

    /* ── FOOTER ── */
    .footer {
      position: fixed;
      bottom: 28px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(0,255,247,0.18);
      animation: fadeUp 0.9s 0.6s ease both;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="scanline"></div>

<div class="container">

  <!-- Logo -->
  <div class="logo-section">
    <div class="live-badge">
      <div class="live-dot"></div>
      Live Application
    </div>
    <div class="app-name">NexChat</div>
    <div class="tagline">Global live chat application</div>
  </div>

  <!-- Decorative divider -->
  <div class="deco-line">
    <span>◈ &nbsp; SYSTEM READY &nbsp; ◈</span>
  </div>

  <!-- Launch button -->
  <div class="btn-wrap">
    <a class="launch-btn" href="public/index.html" target="_blank" rel="noopener noreferrer">
      <div class="btn-corner btn-corner-tl"></div>
      <div class="btn-corner btn-corner-tr"></div>
      <div class="btn-corner btn-corner-bl"></div>
      <div class="btn-corner btn-corner-br"></div>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      <span class="label">Open NexChat</span>
    </a>
  </div>

</div>

<div class="footer">// NexChat Portal &nbsp;·&nbsp; v1.0.0</div>

</body>
</html>
